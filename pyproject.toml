[project]
name = "nanodistill"
version = "0.1.0"
description = "Does the teacher matter? Off-policy knowledge distillation experiments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0",
    "bitsandbytes",
    "cut-cross-entropy @ git+https://github.com/apple/ml-cross-entropy.git@main",
    "datasets>=3.0.0",
    "liger-kernel>=0.5.0",
    "numpy",
    "psutil",
    "tiktoken>=0.8.0",
    "torch>=2.8.0",
    "tqdm",
    "transformers>=4.50.0",
    "wandb",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
